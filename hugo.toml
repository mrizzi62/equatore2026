theme = "blowfish"

baseURL = "https://equatore.org/"
title = "Equatore"

defaultContentLanguage = "it"
locale = "it_IT"

showBreadcrumbs = true

disableLanguages = ["en"]

[pagination]
  pagerSize = 10

[params]
  defaultTheme = "light"
  header = { layout = "basic" }
  favicon = "/favicon.ico"

  [params.assets]
    customCSS = ["css/custom.css"]

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true
      
[[menu.main]]
  name = "Home"
  pageRef = "_index"
  weight = 1
  
[[menu.main]]
  name = "Storia"
  pageRef = "storia"
  weight = 10

[[menu.main]]
  name = "Progetti"
  pageRef = "progetti"
  weight = 20

[[menu.main]]
  name = "Documenti"
  pageRef = "documenti"
  weight = 30

[[menu.main]]
  name = "Contatti"
  pageRef = "contatti"
  weight = 40
  
  
[outputs]
  home = ["HTML", "RSS", "JSON"]
  
[services]
  [services.googleAnalytics]
    id = "G-5FYP0RKNV9"